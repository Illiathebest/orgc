---
# Точка входу CI. Логіка стадій — у ci/*.yml (по файлу на стадію).
# Пайплайн запускається для MR та для default-гілки (main).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build      # збірка образу iac-runner (Kaniko) → Registry
  - lint       # yamllint + ansible-lint у образі iac-runner

include:
  - local: ci/runner-image.gitlab-ci.yml
  - local: ci/lint.gitlab-ci.yml
