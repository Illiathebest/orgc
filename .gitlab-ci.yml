---
# Точка входу CI. Логіка стадій — у ci/*.yml (по файлу на стадію).
# Пайплайн запускається для MR та для default-гілки (main).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Образ, у якому виконуються lint, validate і smoke. Тег — незмінний (коміт,
# що зібрав образ), а не latest: раннер кешує образи (pull_policy
# if-not-present), і latest у кеші міг би лишитися старим. Після зміни
# runner-image/Dockerfile і мерджу збірки в main тег оновлюється тут
# окремою правкою.
variables:
  IAC_RUNNER_IMAGE: "${CI_REGISTRY_IMAGE}/iac-runner:87faade5"

stages:
  - build      # збірка образу iac-runner (Kaniko) → Registry
  - lint       # yamllint, ansible-lint, gofmt, go vet
  - validate   # orgc verify на прикладах моделей + go test
  - smoke      # read-only перевірка живого RouterOS (manual, лише main)

include:
  - local: ci/runner-image.gitlab-ci.yml
  - local: ci/lint.gitlab-ci.yml
  - local: ci/validate.gitlab-ci.yml
  - local: ci/smoke.gitlab-ci.yml
