---
# Підключення до Cisco IOS через network_cli (колекція cisco.ios).
# Значення vault_* живуть у зашифрованому vault.yml цієї ж групи (створюється
# командою: ansible-vault create inventories/staging/group_vars/cisco_switches/vault.yml).
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_user: ansible-net
ansible_password: "{{ vault_cisco_password }}"
ansible_become: true
ansible_become_method: ansible.netcommon.enable
ansible_become_password: "{{ vault_cisco_enable_password }}"
