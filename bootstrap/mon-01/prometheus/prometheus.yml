---
# Prometheus (mon-01): себе, node-exporter на mon-01 і цілі, згенеровані orgc.
# targets/*.json — вихід orgc render з examples/organization.lab.yml (file_sd);
# Prometheus перечитує їх сам, без перезапуску.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: mon-01

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: mon-01

  # Сервери моделі: node_exporter на порту 9100.
  - job_name: orgc-node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]

  # targets/snmp.json (пристрої моделі за mgmt_ip) — для job через
  # snmp_exporter; job вмикається разом із розгортанням експортера, бо без
  # нього кожен пристрій давав би InstanceDown.
