---
# Prometheus (mon-01). M1: збираємо себе та node-exporter на mon-01.
# Скрейп ctrl-01/GitLab/RB750 (snmp_exporter) додається в M4.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: mon-01

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: mon-01
