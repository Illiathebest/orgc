---
# Стадія lint: статична перевірка YAML та Ansible-коду.
# M1: виконується в образі iac-runner з Registry — інструменти вже всередині,
# тому жодних `pip install` у job (відтворюваність + швидкість).
#
# Передумова: образ зібрано (ci/runner-image.gitlab-ci.yml) і лежить як :latest;
# хост-раннер ctrl-01 тягне insecure-registry — 192.168.1.50:5050 додано в
# insecure-registries файла /etc/docker/daemon.json.

.lint-base:
  stage: lint
  image: "${CI_REGISTRY_IMAGE}/iac-runner:latest"
  interruptible: true

yamllint:
  extends: .lint-base
  script:
    - yamllint --strict .

ansible-lint:
  extends: .lint-base
  script:
    - ansible-lint --strict --show-relpath
