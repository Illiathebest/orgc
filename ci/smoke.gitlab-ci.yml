---
# Стадія smoke: read-only перевірка живого RouterOS (RB750) з образу iac-runner.
# Ручний запуск (when: manual) і ЛИШЕ на default-гілці — щоб protected-змінна
# ROUTEROS_PASSWORD була доступна, і щоб доступ до залізного пристрою не
# ініціювався з feature-гілок. Плейбук нічого не змінює (лише читання).
# allow_failure: true — мережевий збій не валить увесь пайплайн main.

smoke-routeros:
  stage: smoke
  image: "${CI_REGISTRY_IMAGE}/iac-runner:latest"
  interruptible: true
  variables:
    # GitLab клонує репозиторій у world-writable каталог, і Ansible з міркувань
    # безпеки ігнорує ansible.cfg у такому каталозі. Тому вказуємо конфіг явно
    # (ANSIBLE_CONFIG) і передаємо інвентар прямо в команду (-i).
    ANSIBLE_CONFIG: "${CI_PROJECT_DIR}/ansible/ansible.cfg"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - cd ansible
    - ansible-playbook -i inventories/staging/hosts.yml playbooks/smoke_routeros.yml
