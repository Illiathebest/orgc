---
# Стадія validate: модель перевіряє сам orgc — схема й інваріанти
# E001–E010, W001–W005 (ADR-008), і тут же проганяються тести orgc.
#
# Два напрямки:
#   orgc-verify — коректні моделі МАЮТЬ давати код 0, зламані — саме код 1.
#                 Код 2 (помилка виклику чи дефект orgc) завдання валить:
#                 негативна перевірка зелена лише тоді, коли orgc знайшов
#                 дефекти моделі, а не тоді, коли він просто впав.
#   go-test     — модульні, корпусні й golden-тести orgc.

.orgc-base:
  stage: validate
  image: "${IAC_RUNNER_IMAGE}"
  interruptible: true
  variables:
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
  cache:
    key: go-v1
    paths:
      - .cache/go-mod
      - .cache/go-build

orgc-verify:
  extends: .orgc-base
  script:
    - (cd orgc && go build -o "${CI_PROJECT_DIR}/orgc-bin" ./cmd/orgc)
    - |
      for m in s-profile m-profile lab; do
        echo "== orgc verify examples/organization.${m}.yml (очікується 0)"
        ./orgc-bin verify "examples/organization.${m}.yml"
      done
    - |
      for m in experiments/e4/models/*.yml; do
        echo "== orgc verify ${m} (очікується 0)"
        ./orgc-bin verify "${m}"
      done
    - |
      for m in broken invariants-broken; do
        echo "== orgc verify examples/organization.${m}.yml (очікується 1)"
        code=0
        ./orgc-bin verify "examples/organization.${m}.yml" || code=$?
        if [ "${code}" -ne 1 ]; then
          echo "ПОМИЛКА: очікувався код 1 (дефекти моделі), отримано ${code}."
          exit 1
        fi
      done

go-test:
  extends: .orgc-base
  script:
    - cd orgc
    - go test ./...
