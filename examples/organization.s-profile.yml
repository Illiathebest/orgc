---
# yaml-language-server: $schema=../schema/organization.schema.json
# Приклад моделі організації — профіль S (малий офіс, один вузол).
# Відповідає лабораторному стенду: HQ на pve-a (RB750 + ctrl-01 + mon-01).
# Валідується схемою schema/organization.schema.json (CI-стадія validate).
organization: "GREENNET Lab"
profile: S

sites:
  - name: hq
    networks:
      - { vlan: 10, name: mgmt, cidr: 192.168.10.0/24 }
      - { vlan: 20, name: users, cidr: 192.168.20.0/24 }
      - { vlan: 30, name: servers, cidr: 192.168.30.0/24 }
      - { vlan: 40, name: guest, cidr: 192.168.40.0/24, isolated: true }
    devices:
      - { name: rb750, type: mikrotik, role: edge_router, mgmt_ip: 192.168.10.1 }
    servers:
      - { name: ctrl-01, role: [docker_host], ip: 192.168.30.10 }
      - { name: mon-01, role: [docker_host, monitoring], ip: 192.168.30.11 }

policies:
  inter_vlan:
    - { from: users, to: servers, ports: [443, 22], action: allow }
    - { from: guest, to: any, action: deny, except: internet }

modules:
  network_fabric: true
  security_observability: true
  server_services: false
  identity_access: false
