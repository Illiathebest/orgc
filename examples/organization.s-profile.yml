---
# yaml-language-server: $schema=../schema/organization.schema.json
# Приклад моделі організації — профіль S (малий офіс, один вузол).
# Відповідає лабораторному стенду: HQ на pve-a (RB750 + ctrl-01 + mon-01).
# Валідується схемою schema/organization.schema.json (CI-стадія validate).
organization: "Навчальна лабораторія"
profile: S

control_node:
  site: hq
  network: servers
  ip: 192.168.30.10

sites:
  - name: hq
    uplinks:
      - { name: isp-main, kind: primary }
    networks:
      - vlan: 10
        name: mgmt
        role: mgmt
        cidr: 192.168.10.0/24
        gateway: 192.168.10.1
      - vlan: 20
        name: users
        role: users
        cidr: 192.168.20.0/24
        gateway: 192.168.20.1
        dhcp_pool: { from: 192.168.20.100, to: 192.168.20.200 }
      - vlan: 30
        name: servers
        role: servers
        cidr: 192.168.30.0/24
        gateway: 192.168.30.1
      - vlan: 40
        name: guest
        role: guest
        cidr: 192.168.40.0/24
        gateway: 192.168.40.1
        dhcp_pool: { from: 192.168.40.100, to: 192.168.40.200 }
        isolated: true
    devices:
      - name: rb750
        type: mikrotik
        os_version: "6.48"
        role: edge_router
        mgmt_ip: 192.168.10.1
    servers:
      - { name: ctrl-01, role: [docker_host], ip: 192.168.30.10 }
      - { name: mon-01, role: [docker_host, monitoring], ip: 192.168.30.11 }

# Між сегментами діє default-deny: усе, чого нема нижче, заборонено.
# Зокрема guest не має жодного правила до внутрішніх сегментів —
# саме відсутність правила і є забороною, окремий deny не потрібен.
policies:
  inter_vlan:
    - { from: servers, to: mgmt, ports: [22], action: allow }
    - { from: users, to: servers, ports: [443, 22], action: allow }
    - { from: users, to: internet, action: allow }
    - { from: guest, to: internet, action: allow }
