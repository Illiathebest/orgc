---
# yaml-language-server: $schema=../../../orgc/schema/organization.schema.json
# W006 на найбільшій топології: резервне зʼєднання acc-01 не несе
# mgmt-мережу. У звичайному режимі керування працює, але відмова
# активного шляху acc-01 відріже комутатор від керування, хоча
# резервний кабель є. orgc verify попереджає (W006); на емуляції це
# перевіряє failover.sh.
organization: "Найбільша топологія"
profile: M

control_node:
  site: hq
  network: servers
  ip: 192.168.30.10

sites:
  - name: hq
    uplinks:
      - { name: isp-hq, kind: primary, port: rb-hq:ether1 }
      - { name: lte-hq, kind: backup, port: rb-hq:ether5 }
    networks:
      - { vlan: 10, name: mgmt, role: mgmt, cidr: 192.168.10.0/24, gateway: 192.168.10.1 }
      - vlan: 20
        name: users
        role: users
        cidr: 192.168.20.0/24
        gateway: 192.168.20.1
        dhcp_pool: { from: 192.168.20.100, to: 192.168.20.200 }
      - { vlan: 30, name: servers, role: servers, cidr: 192.168.30.0/24, gateway: 192.168.30.1 }
    devices:
      - { name: rb-hq, type: mikrotik, os_version: "6.48", role: edge_router, mgmt_ip: 192.168.10.1 }
      - { name: core-01, type: arista_eos, os_version: "4.36.2F", role: core_switch, mgmt_ip: 192.168.10.2 }
      - { name: dist-01, type: arista_eos, os_version: "4.36.2F", role: distribution_switch, mgmt_ip: 192.168.10.3 }
      - { name: dist-02, type: arista_eos, os_version: "4.36.2F", role: distribution_switch, mgmt_ip: 192.168.10.4 }
      - { name: acc-01, type: arista_eos, os_version: "4.36.2F", role: access_switch, mgmt_ip: 192.168.10.5 }
      - name: acc-02
        type: arista_eos
        os_version: "4.36.2F"
        role: access_switch
        mgmt_ip: 192.168.10.6
        access_ports:
          - { ports: [Ethernet3, Ethernet4], network: users }
    servers:
      - { name: ctrl-01, role: [docker_host], ip: 192.168.30.10, port: acc-01:Ethernet5 }
    links:
      - { a: rb-hq:ether2, b: core-01:Ethernet1 }
      - { a: core-01:Ethernet2, b: dist-01:Ethernet1 }
      - { a: core-01:Ethernet3, b: dist-02:Ethernet1 }
      - { a: dist-01:Ethernet2, b: acc-01:Ethernet1, vlans: [mgmt, servers] }
      - { a: dist-02:Ethernet2, b: acc-02:Ethernet1, vlans: [mgmt, users] }
      - { a: dist-02:Ethernet3, b: acc-01:Ethernet2, vlans: [servers], standby: true }
      - { a: dist-01:Ethernet3, b: acc-02:Ethernet2, vlans: [mgmt, users], standby: true }

  - name: branch
    uplinks:
      - { name: isp-branch, kind: primary, port: rb-branch:ether1 }
      - { name: lte-branch, kind: backup, port: rb-branch:ether5 }
    networks:
      - { vlan: 110, name: mgmt-branch, role: mgmt, cidr: 192.168.110.0/24, gateway: 192.168.110.1 }
      - vlan: 120
        name: users-branch
        role: users
        cidr: 192.168.120.0/24
        gateway: 192.168.120.1
        dhcp_pool: { from: 192.168.120.100, to: 192.168.120.200 }
      - { vlan: 130, name: servers-branch, role: servers, cidr: 192.168.130.0/24, gateway: 192.168.130.1 }
    devices:
      - { name: rb-branch, type: mikrotik, os_version: "6.48", role: edge_router, mgmt_ip: 192.168.110.1 }
      - { name: core-br-01, type: arista_eos, os_version: "4.36.2F", role: core_switch, mgmt_ip: 192.168.110.2 }
      - name: acc-br-01
        type: arista_eos
        os_version: "4.36.2F"
        role: access_switch
        mgmt_ip: 192.168.110.3
        access_ports:
          - { ports: [Ethernet3], network: users-branch }
    servers:
      - { name: app-branch-01, role: [docker_host, app], ip: 192.168.130.10, port: acc-br-01:Ethernet5 }
    links:
      - { a: rb-branch:ether2, b: core-br-01:Ethernet1 }
      - { a: core-br-01:Ethernet2, b: acc-br-01:Ethernet1 }
      - { a: rb-branch:ether3, b: acc-br-01:Ethernet2, standby: true }

  - name: dc
    uplinks:
      - { name: isp-dc, kind: primary, port: gw-dc:Ethernet1 }
      - { name: lte-dc, kind: backup, port: gw-dc:Ethernet5 }
    networks:
      - { vlan: 210, name: mgmt-dc, role: mgmt, cidr: 192.168.210.0/24, gateway: 192.168.210.1 }
      - { vlan: 230, name: servers-dc, role: servers, cidr: 192.168.230.0/24, gateway: 192.168.230.1 }
    devices:
      - { name: gw-dc, type: arista_eos, os_version: "4.36.2F", role: edge_router, mgmt_ip: 192.168.210.1 }
      - { name: sw-dc-01, type: arista_eos, os_version: "4.36.2F", role: access_switch, mgmt_ip: 192.168.210.2 }
    servers:
      - { name: db-dc-01, role: [docker_host], ip: 192.168.230.10, port: sw-dc-01:Ethernet5 }
    links:
      - { a: gw-dc:Ethernet2, b: sw-dc-01:Ethernet1 }
      - { a: gw-dc:Ethernet3, b: sw-dc-01:Ethernet2, standby: true }

policies:
  inter_vlan:
    - { from: servers, to: mgmt, ports: [22, 8728], action: allow }
    - { from: servers, to: mgmt-branch, ports: [22, 8728], action: allow }
    - { from: servers, to: mgmt-dc, ports: [22], action: allow }
    - { from: users, to: servers, ports: [443], action: allow }
    - { from: users, to: internet, action: allow }
    - { from: users-branch, to: servers-branch, ports: [443], action: allow }
    - { from: users-branch, to: internet, action: allow }
