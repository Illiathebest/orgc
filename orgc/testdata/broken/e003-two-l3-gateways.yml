---
# Негативний приклад E003: у сайті два L3-шлюзи.
# Рівно одне порушення — решта моделі коректна.
organization: "Навчальна лабораторія"
profile: S

control_node:
  site: hq
  network: mgmt
  ip: 192.168.10.10

sites:
  - name: hq
    networks:
      - { vlan: 10, name: mgmt, role: mgmt, cidr: 192.168.10.0/24, gateway: 192.168.10.1 }
      - { vlan: 30, name: servers, role: servers, cidr: 192.168.30.0/24, gateway: 192.168.30.1 }
    devices:
      - name: rb750
        type: mikrotik
        os_version: "6.48"
        role: edge_router
        mgmt_ip: 192.168.10.1
      - name: fw-01
        type: mikrotik
        os_version: "6.48"
        role: firewall
        mgmt_ip: 192.168.10.2
