---
# Негативний приклад E004: mgmt_ip пристрою належить mgmt-мережі іншого сайту.
# Рівно одне порушення — решта моделі коректна.
organization: "Навчальна лабораторія"
profile: S

control_node:
  site: hq
  network: servers
  ip: 192.168.30.10

sites:
  - name: hq
    networks:
      - { vlan: 10, name: mgmt, role: mgmt, cidr: 192.168.10.0/24, gateway: 192.168.10.1 }
      - { vlan: 30, name: servers, role: servers, cidr: 192.168.30.0/24, gateway: 192.168.30.1 }
    devices:
      - name: rb750
        type: mikrotik
        os_version: "6.48"
        role: edge_router
        mgmt_ip: 192.168.10.1
  - name: branch
    networks:
      - { vlan: 110, name: mgmt-branch, role: mgmt, cidr: 192.168.110.0/24 }
    devices:
      - { name: sw-01, type: arista_eos, os_version: "4.36.2F", role: access_switch, mgmt_ip: 192.168.10.2 }

policies:
  inter_vlan:
    - { from: servers, to: mgmt, ports: [22, 8728], action: allow }
