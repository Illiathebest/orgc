---
# Негативний приклад E008: у мережі /31 немає адрес для хостів, а шлюз є.
# Рівно одне порушення — решта моделі коректна.
organization: "Навчальна лабораторія"
profile: S

control_node:
  site: hq
  network: servers
  ip: 192.168.30.10

sites:
  - name: hq
    networks:
      - { vlan: 10, name: mgmt, role: mgmt, cidr: 192.168.10.0/24, gateway: 192.168.10.1 }
      - { vlan: 30, name: servers, role: servers, cidr: 192.168.30.0/24, gateway: 192.168.30.1 }
      - { vlan: 40, name: lab, role: users, cidr: 192.168.40.0/31, gateway: 192.168.40.1 }
    devices:
      - name: rb750
        type: mikrotik
        os_version: "6.48"
        role: edge_router
        mgmt_ip: 192.168.10.1

policies:
  inter_vlan:
    - { from: servers, to: mgmt, ports: [22, 8728], action: allow }
