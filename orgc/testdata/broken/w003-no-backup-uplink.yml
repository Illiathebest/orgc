---
# Негативний приклад W003: сайт профілю M без резервного каналу.
# Рівно одне порушення — решта моделі коректна.
organization: "Навчальна лабораторія"
profile: M

control_node:
  site: hq
  network: servers
  ip: 192.168.30.10

sites:
  - name: hq
    uplinks:
      - { name: isp, kind: primary }
    networks:
      - { vlan: 10, name: mgmt, role: mgmt, cidr: 192.168.10.0/24, gateway: 192.168.10.1 }
      - { vlan: 30, name: servers, role: servers, cidr: 192.168.30.0/24, gateway: 192.168.30.1 }
    devices:
      - name: rb750
        type: mikrotik
        os_version: "6.48"
        role: edge_router
        mgmt_ip: 192.168.10.1

policies:
  inter_vlan:
    - { from: servers, to: mgmt, ports: [22, 8728], action: allow }
