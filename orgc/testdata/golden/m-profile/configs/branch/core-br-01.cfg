! Згенеровано orgc з m-profile.yml. Не редагувати вручну.
! Пристрій core-br-01 (core_switch), сайт branch, EOS 4.29.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname core-br-01
!
vlan 110
   name mgmt-branch
vlan 120
   name users-branch
vlan 130
   name servers-branch
!
interface Ethernet1
   description trunk to rb-branch:ether2
   switchport mode trunk
   switchport trunk allowed vlan 110,120,130
!
interface Ethernet2
   description trunk to sw-branch-01:Ethernet1
   switchport mode trunk
   switchport trunk allowed vlan 110,120,130
!
interface Vlan110
   description mgmt-branch
   ip address 192.168.110.3/24
!
ip route 0.0.0.0/0 192.168.110.1
!
end
