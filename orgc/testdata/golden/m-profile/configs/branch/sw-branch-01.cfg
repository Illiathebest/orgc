! Згенеровано orgc з m-profile.yml. Не редагувати вручну.
! Пристрій sw-branch-01 (access_switch), сайт branch, EOS 4.29.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname sw-branch-01
!
vlan 110
   name mgmt-branch
vlan 120
   name users-branch
vlan 130
   name servers-branch
!
interface Ethernet1
   description trunk to core-br-01:Ethernet2
   switchport mode trunk
   switchport trunk allowed vlan 110,120,130
!
interface Ethernet3
   description access users-branch
   switchport access vlan 120
!
interface Ethernet4
   description access users-branch
   switchport access vlan 120
!
interface Ethernet5
   description server app-branch-01
   switchport access vlan 130
!
interface Vlan110
   description mgmt-branch
   ip address 192.168.110.2/24
!
ip route 0.0.0.0/0 192.168.110.1
!
end
