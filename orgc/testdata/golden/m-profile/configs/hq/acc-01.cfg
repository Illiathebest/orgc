! Згенеровано orgc з m-profile.yml. Не редагувати вручну.
! Пристрій acc-01 (access_switch), сайт hq, EOS 4.36.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname acc-01
!
vlan 10
   name mgmt
vlan 30
   name servers
!
interface Ethernet1
   description trunk to dist-01:Ethernet2
   switchport mode trunk
   switchport trunk allowed vlan 10,30
!
interface Ethernet5
   description server ctrl-01
   switchport access vlan 30
!
interface Ethernet6
   description server mon-01
   switchport access vlan 30
!
interface Vlan10
   description mgmt
   ip address 192.168.10.5/24
!
ip route 0.0.0.0/0 192.168.10.1
!
end
