! Згенеровано orgc з m-profile.yml. Не редагувати вручну.
! Пристрій acc-02 (access_switch), сайт hq, EOS 4.36.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname acc-02
!
vlan 10
   name mgmt
vlan 20
   name users
!
interface Ethernet1
   description trunk to dist-01:Ethernet3
   switchport mode trunk
   switchport trunk allowed vlan 10,20
!
interface Ethernet3
   description access users
   switchport access vlan 20
!
interface Ethernet4
   description access users
   switchport access vlan 20
!
interface Ethernet5
   description access users
   switchport access vlan 20
!
interface Vlan10
   description mgmt
   ip address 192.168.10.6/24
!
ip route 0.0.0.0/0 192.168.10.1
!
end
