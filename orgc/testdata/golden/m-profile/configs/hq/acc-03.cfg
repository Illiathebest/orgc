! Згенеровано orgc з m-profile.yml. Не редагувати вручну.
! Пристрій acc-03 (access_switch), сайт hq, EOS 4.29.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname acc-03
!
vlan 10
   name mgmt
vlan 20
   name users
vlan 40
   name guest
!
ip access-list orgc-isolate-guest
   10 permit ip any host 192.168.40.1
   20 permit udp any any eq bootps
   30 deny ip any 192.168.40.0/24
   40 permit ip any any
!
interface Ethernet1
   description trunk to dist-02:Ethernet2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,40
!
interface Ethernet3
   description access users
   switchport access vlan 20
!
interface Ethernet4
   description access users
   switchport access vlan 20
!
interface Ethernet6
   description access guest
   switchport access vlan 40
   ip access-group orgc-isolate-guest in
!
interface Vlan10
   description mgmt
   ip address 192.168.10.7/24
!
ip route 0.0.0.0/0 192.168.10.1
!
end
