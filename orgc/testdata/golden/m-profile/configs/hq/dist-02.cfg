! Згенеровано orgc з m-profile.yml. Не редагувати вручну.
! Пристрій dist-02 (distribution_switch), сайт hq, EOS 4.36.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname dist-02
!
vlan 10
   name mgmt
vlan 20
   name users
vlan 30
   name servers
vlan 40
   name guest
!
interface Ethernet1
   description trunk to core-01:Ethernet3
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,40
!
interface Ethernet2
   description trunk to acc-03:Ethernet1
   switchport mode trunk
   switchport trunk allowed vlan 10,20,40
!
interface Vlan10
   description mgmt
   ip address 192.168.10.4/24
!
ip route 0.0.0.0/0 192.168.10.1
!
end
