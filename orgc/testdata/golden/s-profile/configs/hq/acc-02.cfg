! Згенеровано orgc з s-profile.yml. Не редагувати вручну.
! Пристрій acc-02 (access_switch), сайт hq, EOS 4.36.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname acc-02
!
spanning-tree mode rstp
!
vlan 10
   name mgmt
vlan 20
   name users
vlan 30
   name servers
vlan 40
   name guest
!
ip access-list orgc-isolate-guest
   10 permit ip any host 192.168.40.1
   20 permit udp any any eq bootps
   30 deny ip any 192.168.40.0/24
   40 permit ip any any
!
interface Ethernet1
   description trunk to core-01:Ethernet3
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,40
!
interface Ethernet3
   description access users
   switchport access vlan 20
!
interface Ethernet4
   description access users
   switchport access vlan 20
!
interface Ethernet5
   description access users
   switchport access vlan 20
!
interface Ethernet6
   description access guest
   switchport access vlan 40
   ip access-group orgc-isolate-guest in
!
interface Vlan10
   description mgmt
   ip address 192.168.10.4/24
!
ip route 0.0.0.0/0 192.168.10.1
!
end
