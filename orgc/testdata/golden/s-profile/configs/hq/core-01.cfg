! Згенеровано orgc з s-profile.yml. Не редагувати вручну.
! Пристрій core-01 (core_switch), сайт hq, EOS 4.29.2F.
! Обліковий запис для Ansible (ansible-net) і його секрет задаються поза orgc.
!
hostname core-01
!
vlan 10
   name mgmt
vlan 20
   name users
vlan 30
   name servers
vlan 40
   name guest
!
interface Ethernet1
   description trunk to rb750:ether2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,40
!
interface Ethernet2
   description trunk to acc-01:Ethernet1
   switchport mode trunk
   switchport trunk allowed vlan 10,30
!
interface Ethernet3
   description trunk to acc-02:Ethernet1
   switchport mode trunk
   switchport trunk allowed vlan 10,20,30,40
!
interface Vlan10
   description mgmt
   ip address 192.168.10.2/24
!
ip route 0.0.0.0/0 192.168.10.1
!
end
